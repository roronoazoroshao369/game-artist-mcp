name: ci

on:
  push:
    branches:
      - main
      - "poc/**"
  pull_request:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Install package metadata
        run: npm install --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Render POC-001 fixture
        env:
          REQUIRE_PNG: "1"
        run: npm run poc

      - name: Run direct MCP POC-002 smoke
        run: npm run smoke:mcp

      - name: Validate FolderForge plugin package
        run: npx -y @musashishao/folderforge@3.0.1 plugin validate . --json

      - name: Start through FolderForge child-MCP client
        run: npx -y @musashishao/folderforge@3.0.1 plugin test . --call health --args-json '{}' --json

      - name: Assert generated POC-001 artifacts
        run: |
          test -s examples/jade-spirit-stone/generated/jade-spirit-stone.svg
          test -s examples/jade-spirit-stone/generated/jade-spirit-stone.png
          test -s examples/jade-spirit-stone/generated/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: poc-001-jade-spirit-stone
          path: examples/jade-spirit-stone/generated/
