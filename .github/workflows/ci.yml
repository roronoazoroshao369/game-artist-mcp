name: ci

on:
  push:
    branches:
      - main
      - "poc/**"
  pull_request:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FOLDERFORGE_SHA: 59c1096167a81bef24a07fa88453f5c50e0fe64a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Install package metadata
        run: npm install --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Render POC-001 fixture
        env:
          REQUIRE_PNG: "1"
        run: npm run poc

      - name: Run direct MCP POC-002 smoke
        run: npm run smoke:mcp

      - name: Render POC-003 Spirit Lantern draft
        run: npm run poc:003

      - name: Assert POC-003 draft evidence
        run: |
          test -s examples/spirit-lantern/generated/draft.png
          test -s examples/spirit-lantern/generated/draft.svg
          test -s examples/spirit-lantern/generated/technical-report-draft.json
          test -s examples/spirit-lantern/generated/corrected.png
          test -s examples/spirit-lantern/generated/corrected.svg
          test -s examples/spirit-lantern/generated/technical-report-corrected.json
          test -s examples/spirit-lantern/generated/benchmark.json
          grep -q '"visualReview": "PASSED_VISUAL_LOOP"' examples/spirit-lantern/generated/benchmark.json

      - name: Build exact FolderForge integration fixture
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/roronoazoroshao369/FolderForge.git ../FolderForge
          cd ../FolderForge
          git checkout "$FOLDERFORGE_SHA"
          npm ci --ignore-scripts
          npm run build

      - name: Validate FolderForge plugin package
        run: node ../FolderForge/dist/main.js plugin validate "$GITHUB_WORKSPACE" --json

      - name: Start through FolderForge child-MCP client
        run: node ../FolderForge/dist/main.js plugin test "$GITHUB_WORKSPACE" --call health --args-json '{}' --json

      - name: Assert generated POC-001 artifacts
        run: |
          test -s examples/jade-spirit-stone/generated/jade-spirit-stone.svg
          test -s examples/jade-spirit-stone/generated/jade-spirit-stone.png
          test -s examples/jade-spirit-stone/generated/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: poc-001-jade-spirit-stone
          path: examples/jade-spirit-stone/generated/

      - uses: actions/upload-artifact@v4
        with:
          name: poc-003-spirit-lantern-draft
          path: examples/spirit-lantern/generated/
